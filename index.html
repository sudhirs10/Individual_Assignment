<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Moonlight Eats</title>
    <link rel="stylesheet" href="style.css" />
    <script type="module" src="main.js"></script>
  </head>

  <body>
    <header>
      <div>
        <h1>Moonlight Eats</h1>
        <p>Student restaurants in Finland</p>
      </div>

      <div>
        <nav>
          <a href="index.html" aria-current="page">Restaurants</a>
          <a href="account.html">Account</a>
        </nav>

        <p id="user-info" role="status"></p>
        <button id="logout-button" type="button" hidden>Logout</button>
      </div>
    </header>

    <main class="restaurant-layout">
      <aside class="restaurant-sidebar">
        <h2>Restaurants</h2>

        <div class="filters">
          <div>
            <label for="city-filter">City</label>
            <select id="city-filter">
              <option value="">All cities</option>
            </select>
          </div>

          <div>
            <label for="company-filter">Provider</label>
            <select id="company-filter">
              <option value="">All providers</option>
            </select>
          </div>
        </div>

        <p id="restaurant-message" role="status"></p>
        <ul id="restaurant-list"></ul>
      </aside>

      <section class="menu-panel">
        <h2 id="restaurant-name">Welcome to Moonlight Eats</h2>

        <div id="menu-controls" hidden>
          <button
            id="daily-button"
            class="active"
            type="button"
            aria-pressed="true"
          >
            Daily Menu
          </button>

          <button id="weekly-button" type="button" aria-pressed="false">
            Weekly Menu
          </button>
        </div>

        <h3 id="menu-heading" hidden>Today's Menu</h3>
        <p id="message" role="status">
          Choose a restaurant from the list to see its menu.
        </p>

        <div id="menu-content"></div>
      </section>
    </main>
  </body>
</html>
